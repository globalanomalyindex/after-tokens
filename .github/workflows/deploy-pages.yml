name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least-privilege token scopes the pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# one pages deploy at a time; let an in-flight production deploy finish
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GITHUB_PAGES switches next.config into static export + /after-tokens base path
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"

      # bypass jekyll so the _next directory is served as-is
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
